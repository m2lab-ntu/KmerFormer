name: Software and evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        torch: ['2.13.0', '2.14.0']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[review,plots]'
      - run: python scripts/reviewer_check.py --json reviewer-report.json
      - run: python scripts/update_result_tables.py --check
      - run: python scripts/check_evidence.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m pip uninstall -y kmerformer
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          kmerformer-predict --help
          kmerformer-model list
          python -c 'import kmerformer; print(kmerformer.__file__)'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cpu-${{ matrix.torch }}
          path: |
            reviewer-report.json
            dist/*.whl
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.13,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[review,baselines]'
      - run: python -m pytest tests/test_optional_runtime.py -q
        env:
          KMERFORMER_TEST_NTV2: '1'
  released-model:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.13,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: kmerformer-model download kmerformer-6mer-l29-50m --output models/6mer
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/check_model_example.py --model models/6mer
