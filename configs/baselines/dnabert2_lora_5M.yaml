# RESULT: closed-set 100K genus Top-1 58.88%
# Configuration and recorded result: docs/RESULTS.md.
# Historical rationale is preserved at source revision 5a9870d.
model:
  backbone: "zhihan1996/DNABERT-2-117M"
  backbone_loader: "base"           # AutoModel (no MLM head available)
  head_type: "attention_pool"
  head_config:
    hidden_dim: 512
    num_attention_heads: 4
    dropout: 0.15
  freeze_backbone: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # DNABERT-2 uses fused QKV (Wqkv). If LoRA fails to find target, first run
  # once with use_lora=false to inspect module names, then adjust.
  lora_target_modules: ["Wqkv"]
  gradient_checkpointing: false     # custom arch; disable to avoid surprises

# ===== Data =====
data:
  split_strategy: stratified
  fasta_path: "${KF_DATA}/balanced_5M/reads_5M.fa"
  labels_path: "${KF_DATA}/balanced_5M/labels_5M.tsv"
  val_ratio: 0.1
  seed: 42
  # BPE compresses 150bp to ~25-40 tokens on average; 64 leaves headroom.
  max_token_length: 64
  task: "genus"
  rc_augment: true
  # BPE tokenizer handles the raw sequence — no pre-splitting needed.
  kmer_preprocess: null

# ===== Training =====
training:
  seed: null  # Historical initialization was unseeded; data.seed controls the split.
  batch_size: 256
  eval_batch_size: 512
  gradient_accumulation_steps: 1
  num_epochs: 30
  learning_rate: 5.0e-4
  backbone_lr: 3.0e-5
  weight_decay: 0.02
  warmup_ratio: 0.05
  amp: true
  max_grad_norm: 5.0
  early_stopping_patience: 5
  num_workers: 4
  label_smoothing: 0.0
  class_weights: false
  max_class_weight: 10.0
  phase1_epochs: 0

# ===== Output =====
output:
  dir: "${KF_OUT}/dnabert2_lora_5M"
