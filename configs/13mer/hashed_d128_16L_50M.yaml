# RESULT: closed-set 100K genus Top-1 83.83%  |  Track A out-of-genome 21.23%
# Configuration and recorded result: docs/RESULTS.md.
# Historical rationale is preserved at source revision 5a9870d.
model:
  type: "shallow_transformer"
  backbone: "InstaDeepAI/nucleotide-transformer-v2-500m-multi-species"  # unused; kept for config symmetry
  vocab_size: 4194307      # 2^22 buckets + 3 specials (PAD/CLS/UNK) — asserted against the tokenizer
  pad_id: 0
  head_type: "attention_pool"
  head_config:
    hidden_dim: 512
    num_attention_heads: 4
    dropout: 0.15
  max_seq_len: 150         # positional-embedding table (>= max_token_length)
  shallow_config:
    d_model: 128
    nhead: 2
    d_ff: 512
    num_layers: 16
    dropout: 0.1
    sparse_embedding: false  # dense: sparse grads are not usable under DDP here

# ===== Data =====
data:
  split_strategy: stratified
  fasta_path: "${KF_DATA}/balanced_50M/reads_50M.fa"
  labels_path: "${KF_DATA}/balanced_50M/labels_50M.tsv"
  val_ratio: 0.1
  seed: 42
  max_token_length: 140    # 150 bp -> 138 13-mers -> 139 tokens with <cls>
  task: "genus"
  tokenizer:
    type: "hashed_kmer"
    k: 13
    stride: 1
    n_buckets: 4194304     # 2^22
    hash_seed: 42
  rc_augment: true

# ===== Training =====
training:
  seed: null  # Historical initialization was unseeded; data.seed controls the split.
  batch_size: 64           # per-GPU; x8 GPUs x accum 1 = 512 effective (= Job B, = local run)
  eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_epochs: 15
  learning_rate: 5.0e-4
  backbone_lr: 5.0e-4      # same value => differential-LR split is a no-op
  weight_decay: 0.02
  warmup_ratio: 0.05
  amp: true
  # fp16 explicitly: V100 is sm_70 and has no bf16 tensor cores, yet
  # torch.cuda.is_bf16_supported() returns True there. Measured on this
  # exact pipeline: bf16 2.74 it/s vs fp16 11.93 it/s (4.35x).
  amp_dtype: "fp16"
  max_grad_norm: 5.0
  early_stopping_patience: 5
  num_workers: 4
  label_smoothing: 0.0
  class_weights: false
  phase1_epochs: 0

# ===== Output =====
output:
  dir: "${KF_OUT}/hash13_d128_16L_50M"
