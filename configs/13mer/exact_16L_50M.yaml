# RESULT: closed-set 100K genus Top-1 85.63%  |  Track A out-of-genome 23.14%
# Configuration and recorded result: docs/RESULTS.md.
# Historical rationale is preserved at source revision 5a9870d.
model:
  type: "shallow_transformer"
  backbone: "InstaDeepAI/nucleotide-transformer-v2-500m-multi-species"  # unused; kept for config symmetry
  vocab_size: 33545102     # 33,545,099 observed 13-mers + 3 specials — asserted against the tokenizer
  pad_id: 0
  head_type: "attention_pool"
  head_config:
    hidden_dim: 512
    num_attention_heads: 4
    dropout: 0.15
  max_seq_len: 150         # positional-embedding table (>= max_token_length)
  shallow_config:
    d_model: 64            # memory-forced; == MetaTransformer embed_dim
    nhead: 2
    d_ff: 512
    num_layers: 16
    dropout: 0.1
    sparse_embedding: true   # -> sparse grads -> SparseAdam (see train.py)

# ===== Data =====
data:
  split_strategy: random
  fasta_path: "${KF_DATA}/balanced_50M/reads_50M.fa"
  labels_path: "${KF_DATA}/balanced_50M/labels_50M.tsv"
  lazy: true               # stream via byte-offset index; 50M reads cannot be materialised
  val_ratio: 0.1
  seed: 42
  max_token_length: 140    # 150 bp -> 138 13-mers -> 139 tokens with <cls>
  task: "genus"
  tokenizer:
    type: "exact_kmer"
    k: 13
    stride: 1
    vocab_path: "${KF_VOCAB}/vocab_13mer.txt"
    canonical: true          # verified: 49.99% of 4^13, 0.00% RC-also-present, every entry = min of pair
  rc_augment: true

# ===== Training =====
training:
  seed: null  # Historical initialization was unseeded; data.seed controls the split.
  batch_size: 256          # single GPU; 24 GiB embedding+optimiser leaves ~8 GiB for activations
  eval_batch_size: 512
  gradient_accumulation_steps: 2   # 256 x 2 = 512 effective (= Jobs B/C, = local run)
  num_epochs: 15
  learning_rate: 5.0e-4
  backbone_lr: 5.0e-4      # also the SparseAdam LR
  weight_decay: 0.02
  warmup_ratio: 0.05
  amp: true
  # fp16 explicitly: V100 is sm_70 and has no bf16 tensor cores, yet
  # torch.cuda.is_bf16_supported() returns True there. Measured on this
  # exact pipeline: bf16 2.74 it/s vs fp16 11.93 it/s (4.35x).
  amp_dtype: "fp16"
  max_grad_norm: 5.0
  early_stopping_patience: 5
  # Each checkpoint is ~24 GiB (8 GiB weights + 16 GiB of dense SparseAdam
  # moments), so save ~hourly rather than every 5000 steps (~7 min).
  periodic_save_interval: 40000
  num_workers: 4
  label_smoothing: 0.0
  class_weights: false
  phase1_epochs: 0

# ===== Output =====
output:
  dir: "${KF_OUT}/exact13_16L_50M"
