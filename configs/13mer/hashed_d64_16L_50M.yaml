# RESULT: closed-set 100K genus Top-1 79.26%  |  Track A out-of-genome 18.81%
# Configuration and recorded result: docs/RESULTS.md.
# Historical rationale is preserved at source revision 5a9870d.
model:
  type: shallow_transformer
  backbone: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  vocab_size: 4194307
  pad_id: 0
  head_type: attention_pool
  head_config:
    hidden_dim: 512
    num_attention_heads: 4
    dropout: 0.15
  max_seq_len: 150
  shallow_config:
    d_model: 64
    nhead: 2
    d_ff: 512
    num_layers: 16
    dropout: 0.1
    sparse_embedding: false
data:
  split_strategy: stratified
  fasta_path: ${KF_DATA}/balanced_50M/reads_50M.fa
  labels_path: ${KF_DATA}/balanced_50M/labels_50M.tsv
  val_ratio: 0.1
  seed: 42
  max_token_length: 140
  task: genus
  tokenizer:
    type: hashed_kmer
    k: 13
    stride: 1
    n_buckets: 4194304
    hash_seed: 42
  rc_augment: true
training:
  seed: null  # Historical initialization was unseeded; data.seed controls the split.
  batch_size: 64
  eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_epochs: 15
  learning_rate: 0.0005
  backbone_lr: 0.0005
  weight_decay: 0.02
  warmup_ratio: 0.05
  amp: true
  amp_dtype: fp16
  max_grad_norm: 5.0
  early_stopping_patience: 5
  num_workers: 4
  label_smoothing: 0.0
  class_weights: false
  phase1_epochs: 0
output:
  dir: "${KF_OUT}/hash13_d64_16L_50M"
